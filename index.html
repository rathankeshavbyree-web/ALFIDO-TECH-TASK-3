<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRBAV - User Directory</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-container">
            <h1 class="hero-title">VRBAV</h1>
            <p class="hero-tagline">Search, Create & Explore Users in Style</p>
        </div>
    </section>

    <!-- Search Bar Section -->
    <section class="search-section">
        <div class="search-container">
            <div class="search-card">
                <div class="search-input-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search user by name..." class="search-input">
                    <button type="button" id="searchButton" class="search-button">Search</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Add User Section -->
    <section class="add-user-section">
        <div class="add-user-container">
            <div class="add-user-card">
                <h2 class="section-title">Add New User</h2>
                <form class="add-user-form">
                    <div class="form-group">
                        <input type="text" id="userName" placeholder="Name" class="form-input">
                    </div>
                    <div class="form-group">
                        <input type="email" id="userEmail" placeholder="Email" class="form-input">
                    </div>
                    <div class="form-group">
                        <input type="text" id="userCity" placeholder="City" class="form-input">
                    </div>
                    <button type="submit" class="add-user-btn">Add User</button>
                </form>
            </div>
        </div>
    </section>

    <!-- User Directory Section -->
    <section class="user-directory-section">
        <div class="user-directory-container">
            <h2 class="section-title">User Directory</h2>
            <div id="userList" class="user-grid">
                <!-- Sample User Cards -->
                <div class="user-card">
                    <h3 class="user-name">John Doe</h3>
                    <div class="user-details">
                        <div class="detail-row">
                            <span class="detail-label">Email:</span>
                            <span class="detail-value">john.doe@email.com</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">City:</span>
                            <span class="detail-value">Hyderabad</span>
                        </div>
                    </div>
                </div>
                <div class="user-card">
                    <h3 class="user-name">Jane Smith</h3>
                    <div class="user-details">
                        <div class="detail-row">
                            <span class="detail-label">Email:</span>
                            <span class="detail-value">jane.smith@email.com</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">City:</span>
                            <span class="detail-value">Mumbai</span>
                        </div>
                    </div>
                </div>
                <div class="user-card">
                    <h3 class="user-name">Alex Johnson</h3>
                    <div class="user-details">
                        <div class="detail-row">
                            <span class="detail-label">Email:</span>
                            <span class="detail-value">alex.johnson@email.com</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">City:</span>
                            <span class="detail-value">Bangalore</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
